name: ECLIPSE CI

on:
  push:
    branches:
      - eclipse-foundation
  pull_request:
    branches:
      - eclipse-foundation

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Import application modules
        run: |
          python - <<'PY'
          import importlib

          modules = [
              "database",
              "constants",
              "cogs.leveling",
              "cogs.economy",
              "cogs.games",
              "cogs.arcade",
              "cogs.music",
              "cogs.fun",
              "cogs.admin",
              "cogs.ai",
              "cogs.help",
              "cogs.eclipse",
              "cogs.science_game",
              "cogs.rpg",
              "rpg.classes",
              "rpg.manager",
              "rpg.items",
              "rpg.equipment",
              "rpg.skills",
              "rpg.skills_service",
              "rpg.enemies",
              "rpg.combat",
              "rpg.quests",
              "rpg.loot",
              "rpg.world",
              "rpg.exploration",
              "rpg.towns",
              "rpg.crafting",
          ]

          for module in modules:
              importlib.import_module(module)
              print(f"import ok: {module}")
          PY

      - name: Initialize and exercise SQLite schema
        run: |
          python - <<'PY'
          import asyncio
          import tempfile

          from database import Database

          async def smoke():
              with tempfile.NamedTemporaryFile(suffix=".db") as handle:
                  db = Database(handle.name)
                  await db.connect()

                  player = await db.get_rpg_player("ci-guild", "ci-user")
                  assert player["class_key"] == "knight"
                  assert player["level"] == 1

                  world = await db.get_rpg_world("ci-guild")
                  assert world["guild_id"] == "ci-guild"

                  await db.add_rpg_material("ci-guild", "ci-user", "iron_shard", 3)
                  assert await db.has_rpg_materials(
                      "ci-guild", "ci-user", {"iron_shard": 3}
                  )

                  await db.record_game("ci-guild", "ci-user", "dicebattle", "win", 100, 100)
                  user = await db.get_user("ci-guild", "ci-user")
                  assert user["games"] == 1
                  assert user["wins"] == 1
                  assert user["arcade_plays"] == 1
                  assert user["arcade_wins"] == 1
                  assert user["arcade_wagered"] == 100
                  assert user["arcade_net"] == 100
                  assert user["arcade_best_streak"] == 1

                  await db.close()

          asyncio.run(smoke())
          print("database smoke test passed")
          PY
