name: ECLIPSE Render Keepalive

on:
  schedule:
    # Five-minute cadence keeps a Render Free web service below the
    # fifteen-minute idle window. GitHub may delay scheduled jobs slightly.
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        env:
          RENDER_HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
        run: |
          set -euo pipefail

          if [ -z "${RENDER_HEALTH_URL}" ]; then
            echo "::error::RENDER_HEALTH_URL GitHub Actions secret is not configured."
            exit 1
          fi

          url="${RENDER_HEALTH_URL%/}/health"
          echo "Pinging ${url}"

          curl --fail --silent --show-error \
            --max-time 20 \
            --retry 2 \
            --retry-delay 2 \
            "${url}" \
            -o /tmp/health.json

          cat /tmp/health.json
          echo
          echo "Render health endpoint responded successfully."
